name: First Workflow
on:
    push:
    pull_request:
      branches:
        - main
        - dev
        - qa

jobs:
  lint-job:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Setup Node.js in VM
          uses: actions/setup-node@v4
          with:
            node-version: 24
            cache: npm

        - name: Install Dependencies
          run: npm ci

        - name: run ESLint in app
          run: npm run lint
        
  test-job:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Setup Node.js in VM
          uses: actions/setup-node@v4
          with:
            node-version: 24
            cache: npm

        - name: Install Dependencies
          run: npm ci

        - name: run test cases
          run: npm run test

  build-job:
    needs: [lint-job, test-job]
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{secrets.VERCEL_ORG_ID}}
      VERCEL_PROJECT_ID: ${{secrets.VERCEL_PROJECT_ID}}

    steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Setup Node.js in VM
          uses: actions/setup-node@v4
          with:
            node-version: 24
            cache: npm

        - name: Install Dependencies
          run: npm ci

        - name: react build
          run: npm run build

        - name: create artifact
          uses: actions/upload-artifact@v4
          with:
            name: react-build
            path: dist/
            retention-days: 7

        - name: Install Vercel CLI
          run: npm install -g vercel
        
        - name: Vercel Deployment
          run: vercel deploy dist --prod --yes --token="${{secrets.VERCEL_TOKEN}}"
        
